name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate example registry
        run: ze-research validate
      - name: Initialize isolated database
        run: |
          export ZE_JSON_RESEARCH_HOME="$RUNNER_TEMP/ze_json_research_data"
          ze-research init
          ze-research db-status
