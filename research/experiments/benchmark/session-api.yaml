  measurement_contracts:
    - id: session-fixture-v1
      name: Session API benchmark
      operation: Run the registered Session benchmark for the declared payload.
      includes:
        - work performed inside the registered benchmark loop
      excludes:
        - fixture set-up outside the timed loop
      notes: >
        Sapuan parameter diukur sebagai titik terpisah; laporan memakai median
        per baris (nama terdaftar plus argumen), bukan median gabungan.

    - id: grammar-validator-v1
      name: Grammar validator benchmark on real datasets
      operation: >
        Validate the supplied dataset with the selected grammar validator mode.
      includes:
        - work performed inside the registered validator loop
      excludes:
        - dataset loading and the accept-gate verification performed before timing
      notes: >
        Base dan Tapewalk memakai jalur yang berbeda; perbandingan hanya sah pada
        dataset dan proses yang sama.

  execution:
    preset: native-release
    mode: native
    require_clean_worktree: true
    executable_path: "{build_dir}/benchmarks/session_benchmark"
    configure_command:
      - cmake
      - -S
      - "{source_dir}"
      - -B
      - "{build_dir}"
      - -G
      - Ninja
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_COMPILER=clang
      - -DCMAKE_CXX_COMPILER=clang++
      - -DCMAKE_CXX_STANDARD=23
      - -DCMAKE_CXX_STANDARD_REQUIRED=ON
      - -DCMAKE_CXX_EXTENSIONS=OFF
      - -DCMAKE_CXX_FLAGS=-Wno-c2y-extensions
      - -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - -DCMAKE_TOOLCHAIN_FILE={vcpkg_root}/scripts/buildsystems/vcpkg.cmake
    build_command:
      - cmake
      - --build
      - "{build_dir}"
      - --target
      - session_benchmark
    run_command:
      - "{benchmark_executable}"
      - "--benchmark_out={run_dir}/raw/session_benchmark.json"
      - --benchmark_out_format=json
      - --benchmark_repetitions=1
    env_passthrough:
      - VCPKG_ROOT
    expected_outputs:
      - raw/session_benchmark.json
