      name: Session fixture payload
      benchmark_token: placeholder
      dataset_path: null
      dataset_sha256: null
      parameters:
        origin: benchmarks/session_benchmark/main.cpp session fixture
      notes: >
        Digantikan oleh sembilan workload kasus di bawah; entri ini tetap ada
